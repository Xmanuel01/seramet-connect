name: Temporary format management incident recovery
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: format-staging-management-recovery
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'fix/staging-recovery-integrated-20260928'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-recovery-integrated-20260928
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write scripts/staging-management-backlog-plan.mjs scripts/staging-management-backlog-plan.test.mjs scripts/reconcile-staging-management-backlog.mjs src/onboarding/onboarding-service.ts src/onboarding/pass-8-commercial-productization.test.ts src/server/file-import-security.ts scanner-worker/src/scan-adapter.mjs scanner-worker/src/scan-adapter.test.mjs
      - name: Commit formatted files on recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/staging-management-backlog-plan.mjs scripts/staging-management-backlog-plan.test.mjs scripts/reconcile-staging-management-backlog.mjs src/onboarding/onboarding-service.ts src/onboarding/pass-8-commercial-productization.test.ts src/server/file-import-security.ts scanner-worker/src/scan-adapter.mjs scanner-worker/src/scan-adapter.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format management backlog recovery scripts"
            git push origin HEAD:fix/staging-recovery-integrated-20260928
          fi
