name: Prepare cookbook branch

on:
  push:
    branches: [feat/cookbook-authoritative]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cookbook-authoritative
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree
        run: npx vite build >/tmp/cookbook-build.log 2>&1 || true
      - name: Format cookbook implementation
        run: |
          npx prettier --write             src/cookbook/cookbook-service.ts             src/cookbook/cookbook-service.test.ts             src/cookbook/schemas.ts             src/cookbook/use-cookbook.ts             src/server/cookbook-api.ts             src/lib/seramet-api.ts             src/routes/cookbook.tsx             src/components/app/nav.ts             src/platform/module-access-registry.ts             src/routeTree.gen.ts
      - name: Commit generated and formatted files
        run: |
          if git diff --quiet; then
            echo "No generated or formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/cookbook/cookbook-service.ts             src/cookbook/cookbook-service.test.ts             src/cookbook/schemas.ts             src/cookbook/use-cookbook.ts             src/server/cookbook-api.ts             src/lib/seramet-api.ts             src/routes/cookbook.tsx             src/components/app/nav.ts             src/platform/module-access-registry.ts             src/routeTree.gen.ts
          git commit -m "Generate and format authoritative cookbook"
          git push origin HEAD:feat/cookbook-authoritative
