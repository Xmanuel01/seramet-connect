name: Temporary format recovery implementation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-recovery-format
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/staging-recovery-integrated-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-recovery-integrated-20260928
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format incident implementation files only
        run: npx --no-install prettier --write scanner-worker/src/scan-adapter.mjs scanner-worker/src/index.mjs scanner-worker/src/scan-adapter.test.mjs scripts/verify-staging-data-api-lockdown-postgres.mjs
      - name: Commit formatting to recovery feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner-worker/src/scan-adapter.mjs scanner-worker/src/index.mjs \
            scanner-worker/src/scan-adapter.test.mjs scripts/verify-staging-data-api-lockdown-postgres.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format staged scanner and lockdown test code"
            git push origin HEAD:fix/staging-recovery-integrated-20260928
          fi
