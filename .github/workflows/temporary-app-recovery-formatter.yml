name: Temporary app recovery formatter

on:
  push:
    branches: [fix/staging-app-restore-audited-alternative]

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/staging-app-recovery-guards.mjs scripts/staging-app-recovery-guards.test.mjs scripts/reconcile-staging-menu-imports-app-restore.mjs
      - run: node --test scripts/staging-app-recovery-guards.test.mjs
      - name: Emit formatted source for existing branch review
        run: |
          for f in scripts/staging-app-recovery-guards.mjs scripts/staging-app-recovery-guards.test.mjs scripts/reconcile-staging-menu-imports-app-restore.mjs; do
            echo "SERAMET_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "SERAMET_FORMAT_END:$f"
          done
