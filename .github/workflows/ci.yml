name: Seramet CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject accidental Lovable source integration
        run: node --test scripts/assert-no-lovable-source.test.mjs && node scripts/assert-no-lovable-source.mjs
      - name: Verify required release-input policy
        run: node --test scripts/main-branch-protection.test.mjs
      - run: npm ci
      - run: npm ls --all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --include=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/verify-staging-health.test.mjs
      - run: node --test scripts/verify-production-health.test.mjs
      - run: node --test scripts/production-recovery.test.mjs
      - run: node --test scripts/verify-staging-release-gate.test.mjs
      - run: node --test scripts/inspect-staging-backlog.test.mjs
      - run: node --test scripts/verify-certification-schema-postgres.test.mjs
      - run: node --test scripts/staging-menu-reconciliation-plan.test.mjs
      - run: node --test scripts/staging-management-backlog-plan.test.mjs
      - run: node --test scripts/staging-recovery-cli-args.test.mjs
      - run: node --test scripts/assert-staging-api-posture.test.mjs
      - run: node --test scripts/prepare-staging-postgres-ca.test.mjs scripts/staging-postgres-tls.test.mjs scripts/staging-connectivity-diagnostic.test.mjs
      - run: npm run build
      - name: Render public pages in the actual Cloudflare runtime
        run: npx --yes --package=wrangler@4.86.0 -c "node scripts/verify-worker-pages.mjs"
      - name: Exercise public runtime rejection through compiled Cloudflare fetch
        run: node scripts/verify-compiled-public-runtime.mjs
      - name: Verify compiled Cloudflare Queue and Cron handlers
        run: node scripts/verify-cloudflare-events.mjs
      - name: Verify production bundle has no source secrets
        run: npm run audit:bundle

  postgres-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seramet_test
          POSTGRES_USER: seramet_test
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seramet_test -d seramet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERAMET_POSTGRES_URL: postgresql://seramet_test:isolated_ci_only@127.0.0.1:5432/seramet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply every historical migration on disposable real PostgreSQL
        run: npm run migrate:postgres
      - name: Assert the CRM schema, JSON compatibility and immutable audit triggers
        run: node scripts/verify-crm-postgres.mjs
      - name: Verify complete migration ledger and menu/workforce RLS
        run: node scripts/verify-certification-schema-postgres.mjs
      - name: Execute authoritative CRM pipeline and campaign queries on PostgreSQL
        run: ./node_modules/.bin/vite-node scripts/verify-crm-postgres-runtime.ts
      - name: Validate public schema lockdown on disposable PostgreSQL
        run: node scripts/verify-staging-data-api-lockdown-postgres.mjs

  postgres-recovery-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seramet_production_restore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_restore_only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seramet_production_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERAMET_POSTGRES_URL: postgresql://postgres:disposable_restore_only@127.0.0.1:54329/seramet_production_restore
      SERAMET_PRODUCTION_RESTORE_POSTGRES_URL: postgresql://postgres:disposable_restore_only@127.0.0.1:54329/seramet_production_restore
      SERAMET_PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
      SERAMET_PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install matching disposable database client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Apply complete schema to disposable recovery fixture only
        run: npm run migrate:postgres
      - name: Encrypt, retrieve, restore and compare actual persisted fixture records
        run: node scripts/verify-production-recovery-fixture.mjs
