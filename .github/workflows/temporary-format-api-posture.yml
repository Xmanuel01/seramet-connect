name: Temporary format staging security gate
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
concurrency:
  group: staging-api-security-format
  cancel-in-progress: true
jobs:
  format:
    if: github.head_ref == 'fix/staging-recovery-integrated-20260928'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-recovery-integrated-20260928
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write scripts/assert-staging-api-posture.mjs scripts/assert-staging-api-posture.test.mjs
      - name: Commit formatted security checker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/assert-staging-api-posture.mjs scripts/assert-staging-api-posture.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format fail-closed staging API security verifier"
            git push origin HEAD:fix/staging-recovery-integrated-20260928
          fi
