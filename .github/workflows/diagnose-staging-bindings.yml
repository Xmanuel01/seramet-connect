name: Diagnose staging bindings

on:
  push:
    branches: [diag/staging-bindings]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect existing Worker bindings and account resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare deployment credentials are not configured in the staging environment."
            exit 2
          fi

          api() {
            local path="$1"
            local out="$2"
            curl --fail-with-body --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/${path}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -o "${out}"
          }

          api "workers/scripts/seramet-staging/settings" /tmp/worker-settings.json
          api "workers/scripts" /tmp/scripts.json || true
          api "queues?per_page=100" /tmp/queues.json || true
          api "r2/buckets?per_page=100" /tmp/r2.json || true
          api "hyperdrive/configs?per_page=100" /tmp/hyperdrive.json || true

          node <<'NODE'
          const fs = require("fs");

          const read = (path) => {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); }
            catch { return null; }
          };
          const usefulName = (value) => /seramet|staging|scanner|malware/i.test(String(value ?? ""));

          const settings = read("/tmp/worker-settings.json");
          if (!settings?.success || !settings.result) {
            console.error("Cloudflare settings lookup did not succeed.");
            process.exit(3);
          }

          const wanted = new Set([
            "SERAMET_HYPERDRIVE",
            "SERAMET_WORK_QUEUE",
            "SERAMET_OBJECTS",
            "SERAMET_MALWARE_SCANNER",
            "SERAMET_SUPABASE_URL",
            "SERAMET_SUPABASE_PUBLISHABLE_KEY",
            "SERAMET_PUBLIC_ORIGIN",
            "SERAMET_ALLOWED_ORIGINS",
            "SERAMET_JWT_SECRET",
          ]);
          const allBindingNames = (settings.result.bindings ?? []).map((binding) => ({
            name: binding.name,
            type: binding.type,
          }));
          const bindings = (settings.result.bindings ?? [])
            .filter((binding) => wanted.has(binding.name))
            .map((binding) => ({
              name: binding.name,
              type: binding.type,
              configured: true,
              ...(binding.type === "hyperdrive" && binding.id ? { id: binding.id } : {}),
              ...(binding.type === "r2_bucket" && binding.bucket_name
                ? { bucket_name: binding.bucket_name }
                : {}),
              ...(binding.type === "queue" && binding.queue_name
                ? { queue_name: binding.queue_name }
                : {}),
              ...(binding.type === "service" && binding.service ? { service: binding.service } : {}),
            }));

          const scriptsPayload = read("/tmp/scripts.json");
          const scripts = Array.isArray(scriptsPayload?.result)
            ? scriptsPayload.result
                .map((row) => row.id ?? row.name)
                .filter(usefulName)
            : [];

          const queuesPayload = read("/tmp/queues.json");
          const queueRows = Array.isArray(queuesPayload?.result)
            ? queuesPayload.result
            : Array.isArray(queuesPayload?.result?.queues)
              ? queuesPayload.result.queues
              : [];
          const queues = queueRows
            .map((row) => ({ id: row.queue_id ?? row.id, name: row.queue_name ?? row.name }))
            .filter((row) => usefulName(row.name));

          const r2Payload = read("/tmp/r2.json");
          const r2Rows = Array.isArray(r2Payload?.result?.buckets)
            ? r2Payload.result.buckets
            : Array.isArray(r2Payload?.result)
              ? r2Payload.result
              : [];
          const buckets = r2Rows
            .map((row) => ({ name: row.name }))
            .filter((row) => usefulName(row.name));

          const hyperPayload = read("/tmp/hyperdrive.json");
          const hyperRows = Array.isArray(hyperPayload?.result)
            ? hyperPayload.result
            : Array.isArray(hyperPayload?.result?.configs)
              ? hyperPayload.result.configs
              : [];
          const hyperdrives = hyperRows
            .map((row) => ({ id: row.id, name: row.name }))
            .filter((row) => usefulName(row.name) || row.id === "c8cc4b932f564daeb71047422ea6c42f");

          console.log(JSON.stringify({ allBindingNames, bindings, scripts, queues, buckets, hyperdrives }, null, 2));
          NODE
