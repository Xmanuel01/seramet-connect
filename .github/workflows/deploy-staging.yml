name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: seramet-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Resolve existing Cloudflare staging bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_SCANNER_SERVICE: ${{ vars.SERAMET_MALWARE_SCANNER_SERVICE }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/seramet-staging/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/worker-settings.json
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/queues.json

          node <<'NODE'
          const fs = require("fs");
          const settings = JSON.parse(fs.readFileSync("/tmp/worker-settings.json", "utf8"));
          const queuesPayload = JSON.parse(fs.readFileSync("/tmp/queues.json", "utf8"));
          if (!settings.success || !settings.result) {
            throw new Error("Existing seramet-staging Worker settings could not be loaded");
          }

          const bindings = new Map(
            (settings.result.bindings ?? []).map((binding) => [binding.name, binding]),
          );
          const hyperdrive = bindings.get("SERAMET_HYPERDRIVE")?.id;
          const bucket = bindings.get("SERAMET_OBJECTS")?.bucket_name;
          const workQueue = bindings.get("SERAMET_WORK_QUEUE")?.queue_name;
          const publicOrigin = bindings.get("SERAMET_PUBLIC_ORIGIN")?.text;
          // A staging environment variable can supply the actual scanner Worker
          // service name before it has ever been bound to the existing POS Worker.
          const scannerService =
            bindings.get("SERAMET_MALWARE_SCANNER")?.service ||
            process.env.STAGING_SCANNER_SERVICE?.trim();
          if (scannerService && !/^[a-zA-Z0-9_-]+$/.test(scannerService)) {
            throw new Error("Invalid staging scanner service name");
          }

          const queueRows = Array.isArray(queuesPayload.result)
            ? queuesPayload.result
            : Array.isArray(queuesPayload.result?.queues)
              ? queuesPayload.result.queues
              : [];
          const expectedDlq = workQueue?.replace(/-work$/, "-dlq");
          const dlq = queueRows
            .map((row) => row.queue_name ?? row.name)
            .find((name) => name === expectedDlq || name === "seramet-staging-dlq");

          // Full staging readiness requires a real configured scanner; never treat
          // scanner absence as a successful deploy just because HTTP is 200.
          const required = { hyperdrive, bucket, workQueue, dlq, publicOrigin, scannerService };
          const missing = Object.entries(required)
            .filter(([, value]) => !value)
            .map(([name]) => name);
          if (missing.length) {
            throw new Error(`Existing staging resources are incomplete: ${missing.join(", ")}`);
          }

          const append = (name, value) => {
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          };
          append("SERAMET_CLOUDFLARE_WORKER_NAME", "seramet-staging");
          append("SERAMET_CLOUDFLARE_HYPERDRIVE_ID", hyperdrive);
          append("SERAMET_CLOUDFLARE_R2_BUCKET", bucket);
          append("SERAMET_CLOUDFLARE_QUEUE", workQueue);
          append("SERAMET_CLOUDFLARE_DLQ", dlq);
          append("SERAMET_PUBLIC_ORIGIN", publicOrigin);
          if (scannerService) {
            append("SERAMET_MALWARE_SCANNER_SERVICE", scannerService);
          }
          NODE

      - name: Verify real malware-scanner Worker exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The previous preflight established an allowed service name. Verify that
          # the target script actually exists; a configured string is not proof.
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SERAMET_MALWARE_SCANNER_SERVICE}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /dev/null

      - name: Require release-specific backup and pending-work approval
        env:
          SERAMET_STAGING_APPROVED_SHA: ${{ vars.SERAMET_STAGING_APPROVED_SHA }}
          SERAMET_STAGING_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          SERAMET_STAGING_BACKLOG_REVIEW_APPROVED: ${{ vars.SERAMET_STAGING_BACKLOG_REVIEW_APPROVED }}
        run: node scripts/verify-staging-release-gate.mjs

      - name: Inspect pending staging work and block overlapping menu commits
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
        run: node scripts/inspect-staging-backlog.mjs

      # Only after resource and release safety gates may any staging database
      # migrations or Cloudflare origin settings change.
      - name: Apply PostgreSQL migrations
        run: npm run migrate:postgres
        env:
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}

      - name: Synchronize Hyperdrive origin credentials
        run: |
          npx --yes wrangler@4.15.2 hyperdrive update "$SERAMET_CLOUDFLARE_HYPERDRIVE_ID" \
            --connection-string "$SERAMET_POSTGRES_URL"
          curl --fail-with-body --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/hyperdrive/configs/${SERAMET_CLOUDFLARE_HYPERDRIVE_ID}/restart" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
        env:
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate Cloudflare binding configuration
        run: node scripts/render-cloudflare-config.mjs staging
        env:
          SERAMET_REUSE_EXISTING_VARS: "true"
          SERAMET_APP_VERSION: ${{ github.ref_name }}
          SERAMET_BUILD_ID: ${{ github.sha }}

      - name: Deploy Worker
        run: npx --yes wrangler@4.15.2 deploy --config .seramet/wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify liveness
        run: curl --fail-with-body --retry 8 --retry-delay 5 "${SERAMET_PUBLIC_ORIGIN}/api/seramet/health/live"

      - name: Verify operational readiness and schema version
        run: node scripts/verify-staging-health.mjs operational

      - name: Verify public authentication bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "${SERAMET_PUBLIC_ORIGIN}/api/seramet/public/auth/config"             -o /tmp/auth-config.json
          node <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/auth-config.json", "utf8"));
          if (payload.ok !== true || payload.provider !== "supabase" || payload.enabled !== true) {
            throw new Error(`Public authentication bootstrap is not ready: ${JSON.stringify(payload)}`);
          }
          console.log(JSON.stringify(payload));
          NODE

      - name: Verify unregistered device bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "${SERAMET_PUBLIC_ORIGIN}/api/seramet/public/device/startup"             -o /tmp/device-startup.json
          node <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/device-startup.json", "utf8"));
          if (payload.ok !== true || payload.state !== "UNREGISTERED") {
            throw new Error(`Unregistered device bootstrap failed: ${JSON.stringify(payload)}`);
          }
          console.log(JSON.stringify(payload));
          NODE

      - name: Require full staging readiness
        run: node scripts/verify-staging-health.mjs ready
