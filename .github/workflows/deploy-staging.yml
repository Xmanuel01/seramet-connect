name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Apply PostgreSQL migrations
        run: npm run migrate:postgres
        env:
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
      - name: Generate Cloudflare binding configuration
        run: node scripts/render-cloudflare-config.mjs staging
        env:
          SERAMET_CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.SERAMET_CLOUDFLARE_HYPERDRIVE_ID }}
          SERAMET_CLOUDFLARE_R2_BUCKET: ${{ vars.SERAMET_CLOUDFLARE_R2_BUCKET }}
          SERAMET_CLOUDFLARE_QUEUE: ${{ vars.SERAMET_CLOUDFLARE_QUEUE }}
          SERAMET_CLOUDFLARE_DLQ: ${{ vars.SERAMET_CLOUDFLARE_DLQ }}
          SERAMET_MALWARE_SCANNER_SERVICE: ${{ vars.SERAMET_MALWARE_SCANNER_SERVICE }}
          SERAMET_SUPABASE_URL: ${{ vars.SERAMET_SUPABASE_URL }}
          SERAMET_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SERAMET_SUPABASE_PUBLISHABLE_KEY }}
          SERAMET_PUBLIC_ORIGIN: ${{ vars.SERAMET_PUBLIC_ORIGIN }}
          SERAMET_ALLOWED_ORIGINS: ${{ vars.SERAMET_ALLOWED_ORIGINS }}
          SERAMET_APP_VERSION: ${{ github.ref_name }}
          SERAMET_BUILD_ID: ${{ github.sha }}
      - name: Deploy Worker
        run: npx --yes wrangler@4.15.2 deploy --config .seramet/wrangler.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify readiness
        run: curl --fail --retry 8 --retry-delay 5 "${{ vars.SERAMET_PUBLIC_ORIGIN }}/api/seramet/health/ready"
