name: Format Inventory Operations

on:
  push:
    branches:
      - feat/inventory-operations-control
    paths:
      - .github/workflows/format-inventory-operations.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inventory-operations-control
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed Inventory operation files
        run: |
          npx prettier --write \
            src/inventory/inventory-intelligence-service.ts \
            src/inventory/schemas.ts \
            src/inventory/use-inventory-operations.ts \
            src/inventory/use-inventory-control-centre.ts \
            src/inventory/pass-6-inventory-intelligence.test.ts \
            src/server/inventory-api.ts \
            src/routes/adjustments.tsx \
            src/routes/wastage.tsx \
            src/routes/breakages.tsx \
            src/routes/par.tsx \
            src/routes/warehouses.tsx \
            src/routes/transfers.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/inventory/inventory-intelligence-service.ts \
            src/inventory/schemas.ts \
            src/inventory/use-inventory-operations.ts \
            src/inventory/use-inventory-control-centre.ts \
            src/inventory/pass-6-inventory-intelligence.test.ts \
            src/server/inventory-api.ts \
            src/routes/adjustments.tsx \
            src/routes/wastage.tsx \
            src/routes/breakages.tsx \
            src/routes/par.tsx \
            src/routes/warehouses.tsx \
            src/routes/transfers.tsx
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "Format Inventory operations"
            git push origin HEAD:feat/inventory-operations-control
          fi
