name: Staging incident recovery (manual only)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a read-only plan first; writes need verified backup, isolated restore and exact-plan approval"
        required: true
        type: choice
        options:
          - inspect-imports
          - quarantine-imports
          - inspect-management
          - consolidate-management
        default: inspect-imports
      approved_plan_sha256:
        description: "Required for writes: exact 64-character SHA-256 from the latest read-only plan"
        required: false
        type: string
      approved_tenant_ref:
        description: "Required for import write: masked tenant ref from the plan"
        required: false
        type: string
      approved_canonical_ref:
        description: "Required for import write: masked reference-only V3 import ref"
        required: false
        type: string
      approved_branch_ref:
        description: "Required for management write: masked bootstrap branch ref"
        required: false
        type: string
      approved_retained_job_ref:
        description: "Required for management write: masked single retained management job"
        required: false
        type: string
      acknowledge_unscanned_no_replay:
        description: "Explicitly confirm old UNSCANNED imports will never be replayed"
        required: true
        type: boolean
        default: false
      acknowledge_queue_redelivery_reviewed:
        description: "Explicitly confirm existing Cloudflare Queue and DLQ messages have been reviewed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seramet-staging-incident-data-recovery
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check write prerequisites independently
        if: inputs.operation == 'quarantine-imports' || inputs.operation == 'consolidate-management'
        env:
          TARGET: ${{ inputs.operation }}
          APPROVED_SHA: ${{ inputs.approved_plan_sha256 }}
          STAGING_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          BACKUP_EVIDENCE: ${{ secrets.SERAMET_STAGING_RESTORE_EVIDENCE }}
          STAGING_OPERATOR_APPROVAL: ${{ vars.SERAMET_STAGING_RECOVERY_OPERATOR_APPROVED }}
          NO_REPLAY: ${{ inputs.acknowledge_unscanned_no_replay }}
          QUEUE_REVIEW: ${{ inputs.acknowledge_queue_redelivery_reviewed }}
        run: |
          node <<'NODE'
          const e = process.env;
          if (e.STAGING_BACKUP_RESTORE_VERIFIED !== 'true' ||
              !e.BACKUP_EVIDENCE?.trim() ||
              e.STAGING_OPERATOR_APPROVAL !== 'true' ||
              !/^[a-f0-9]{64}$/.test(e.APPROVED_SHA || '')) {
            throw new Error('Refusing data mutation without independent backup+isolated restore, protected operator approval and the exact current plan SHA');
          }
          if (e.TARGET === 'quarantine-imports' && e.NO_REPLAY !== 'true') {
            throw new Error('Unscanned historical menu imports cannot be replayed');
          }
          if (e.TARGET === 'consolidate-management' && e.QUEUE_REVIEW !== 'true') {
            throw new Error('Cloudflare Queue redelivery inventory has not been reviewed');
          }
          NODE
      - name: Run guarded read-only import plan
        if: inputs.operation == 'inspect-imports'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
        run: node scripts/reconcile-staging-menu-imports.mjs --plan
      - name: Execute separately approved import quarantine
        if: inputs.operation == 'quarantine-imports'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_RECONCILE_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          SERAMET_RECONCILE_RESTORE_EVIDENCE: ${{ secrets.SERAMET_STAGING_RESTORE_EVIDENCE }}
          SERAMET_RECONCILE_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          SERAMET_RECONCILE_APPROVED_TENANT_REF: ${{ inputs.approved_tenant_ref }}
          SERAMET_RECONCILE_APPROVED_CANONICAL_REF: ${{ inputs.approved_canonical_ref }}
          SERAMET_RECONCILE_UNSCANNED_IMPORTS_WILL_NOT_REPLAY: ${{ inputs.acknowledge_unscanned_no_replay }}
          SERAMET_RECONCILE_OPERATOR: ${{ github.actor }}
        run: node scripts/reconcile-staging-menu-imports.mjs --apply
      - name: Run guarded read-only management plan
        if: inputs.operation == 'inspect-management'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
        run: node scripts/reconcile-staging-management-backlog.mjs --plan
      - name: Execute separately approved management backlog consolidation
        if: inputs.operation == 'consolidate-management'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_MANAGEMENT_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          SERAMET_MANAGEMENT_RESTORE_EVIDENCE: ${{ secrets.SERAMET_STAGING_RESTORE_EVIDENCE }}
          SERAMET_MANAGEMENT_OPERATOR: ${{ github.actor }}
          SERAMET_MANAGEMENT_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          SERAMET_MANAGEMENT_APPROVED_BRANCH_REF: ${{ inputs.approved_branch_ref }}
          SERAMET_MANAGEMENT_APPROVED_RETAINED_JOB_REF: ${{ inputs.approved_retained_job_ref }}
          SERAMET_MANAGEMENT_QUEUE_REDELIVERY_REVIEWED: ${{ inputs.acknowledge_queue_redelivery_reviewed }}
        run: node scripts/reconcile-staging-management-backlog.mjs --apply
