name: Staging incident recovery (manual only)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose a read-only plan first; writes need verified backup, isolated restore and exact-plan approval"
        required: true
        type: choice
        options:
          - verify-backup-restore
          - verify-full-backup-restore
          - inspect-uber
          - inspect-imports
          - quarantine-imports
          - inspect-management
          - consolidate-management
        default: inspect-imports
      approved_plan_sha256:
        description: "Required for writes: exact 64-character SHA-256 from the latest read-only plan"
        required: false
        type: string
      approved_recovery_sha:
        description: "Expanded read-only recovery only: exact tested commit; not deployment approval"
        required: false
        type: string
      acknowledge_full_recovery:
        description: "Owner approved encrypted Auth/public/Storage backup and isolated recovery only"
        required: true
        type: boolean
        default: false
      approved_tenant_ref:
        description: "Required for import write: masked tenant ref from the plan"
        required: false
        type: string
      approved_canonical_ref:
        description: "Required for import write: masked reference-only V3 import ref"
        required: false
        type: string
      approved_branch_ref:
        description: "Required for management write: masked bootstrap branch ref"
        required: false
        type: string
      approved_retained_job_ref:
        description: "Required for management write: masked single retained management job"
        required: false
        type: string
      acknowledge_unscanned_no_replay:
        description: "Explicitly confirm old UNSCANNED imports will never be replayed"
        required: true
        type: boolean
        default: false
      acknowledge_queue_redelivery_reviewed:
        description: "Explicitly confirm existing Cloudflare Queue and DLQ messages have been reviewed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Share the staging database/deployment lock. A backup snapshot, restore
  # certification, migration, lockdown or deployment must not overlap.
  group: seramet-staging
  cancel-in-progress: false

jobs:
  full-recovery:
    if: >-
      inputs.operation == 'verify-full-backup-restore' &&
      github.ref == 'refs/heads/codex/phase3-completion' &&
      github.actor == 'Xmanuel01' && github.triggering_actor == 'Xmanuel01'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-full-restore-only
          POSTGRES_DB: seramet_full_restore
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERAMET_PHASE3_RECOVERY_APPROVED_SHA: ${{ inputs.approved_recovery_sha }}
      SERAMET_PHASE3_FULL_RECOVERY_ACK: ${{ inputs.acknowledge_full_recovery }}
      SERAMET_STAGING_BACKUP_KEY_ESCROW_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_KEY_ESCROW_VERIFIED }}
      SERAMET_FULL_RECOVERY_DIRECTORY: ${{ runner.temp }}/phase3-full-recovery
    steps:
      - uses: actions/checkout@v4
      - name: Authorize exact owner-approved read-only recovery
        run: node --input-type=module -e "import {authorizeFullRecovery} from './scripts/staging-full-recovery-core.mjs'; authorizeFullRecovery(process.env)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test recovery fences and security evidence queries
        run: node --test scripts/staging-full-recovery-core.test.mjs scripts/staging-full-recovery-sql.test.mjs scripts/staging-recovery-envelope.test.mjs
      - name: Prepare pinned staging PostgreSQL CA
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_STAGING_POSTGRES_CA_PEM: ${{ secrets.SERAMET_STAGING_POSTGRES_CA_PEM }}
          SERAMET_STAGING_POSTGRES_CA_SHA256: ${{ vars.SERAMET_STAGING_POSTGRES_CA_SHA256 }}
        run: node scripts/prepare-staging-postgres-ca.mjs
      - name: Install PostgreSQL 17 backup client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Create encrypted expanded staging backup (source read only)
        env:
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_STAGING_BACKUP_KEY: ${{ secrets.SERAMET_STAGING_BACKUP_KEY }}
        run: node scripts/staging-full-recovery.mjs backup
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-full-recovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase3-full-recovery/encrypted/*.enc
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@v4
        with:
          name: phase3-full-recovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase3-full-recovery/downloaded
      - name: Restore downloaded encrypted backup to isolated PostgreSQL only
        env:
          SERAMET_RESTORE_POSTGRES_URL: postgresql://postgres:isolated-full-restore-only@127.0.0.1:54329/seramet_full_restore
          SERAMET_STAGING_BACKUP_KEY: ${{ secrets.SERAMET_STAGING_BACKUP_KEY }}
        run: node scripts/staging-full-recovery.mjs restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-full-recovery-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/phase3-full-recovery/result.json
            ${{ runner.temp }}/phase3-full-recovery/diagnostics/*.enc
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove decrypted temporary recovery material
        if: always()
        run: rm -rf "$RUNNER_TEMP/phase3-full-recovery"
  recovery:
    if: >-
      (github.ref == 'refs/heads/main' && inputs.operation != 'verify-full-backup-restore') ||
      (inputs.operation == 'verify-backup-restore' &&
       github.ref == 'refs/heads/codex/validated-release-candidate' &&
       github.actor == github.repository_owner && github.triggering_actor == github.repository_owner) ||
      ((inputs.operation == 'verify-backup-restore' || inputs.operation == 'inspect-uber') &&
       github.ref == 'refs/heads/codex/malware-scanner-staging')
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-only
          POSTGRES_DB: seramet_restore
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved backup candidate
        if: inputs.operation == 'verify-backup-restore'
        env:
          APPROVED_SHA: ${{ vars.SERAMET_STAGING_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          test -n "$APPROVED_SHA"
          test "$CANDIDATE_SHA" = "$APPROVED_SHA"
      - name: Require recovery encryption and offline key escrow
        if: inputs.operation == 'verify-backup-restore'
        env:
          BACKUP_KEY: ${{ secrets.SERAMET_STAGING_BACKUP_KEY }}
          KEY_ESCROW_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_KEY_ESCROW_VERIFIED }}
        run: |
          test -n "$BACKUP_KEY"
          test "$KEY_ESCROW_VERIFIED" = "true"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare pinned staging PostgreSQL root CA
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_STAGING_POSTGRES_CA_PEM: ${{ secrets.SERAMET_STAGING_POSTGRES_CA_PEM }}
          SERAMET_STAGING_POSTGRES_CA_SHA256: ${{ vars.SERAMET_STAGING_POSTGRES_CA_SHA256 }}
        run: node scripts/prepare-staging-postgres-ca.mjs
      - name: Inspect Uber Eats sandbox connection without exposing credentials
        if: inputs.operation == 'inspect-uber'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
        run: node scripts/inspect-staging-uber.mjs
      - name: Install PostgreSQL 17 client
        if: inputs.operation == 'verify-backup-restore'
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Create staging application database backup
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
          SERAMET_BACKUP_PATH: ${{ runner.temp }}/seramet-staging-public.dump
          SERAMET_SOURCE_EVIDENCE_PATH: ${{ runner.temp }}/seramet-staging-source-evidence.json
        run: node scripts/create-staging-backup.mjs
      - name: Encrypt staging recovery files
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_STAGING_BACKUP_KEY: ${{ secrets.SERAMET_STAGING_BACKUP_KEY }}
        run: node scripts/staging-recovery-envelope.mjs seal "$RUNNER_TEMP" "$RUNNER_TEMP/encrypted-recovery"
      - name: Retain encrypted staging recovery point
        if: inputs.operation == 'verify-backup-restore'
        uses: actions/upload-artifact@v4
        with:
          name: staging-recovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-recovery/*.enc
          if-no-files-found: error
          retention-days: 7
      - name: Download retained recovery point
        if: inputs.operation == 'verify-backup-restore'
        uses: actions/download-artifact@v4
        with:
          name: staging-recovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/downloaded-recovery
      - name: Authenticate and decrypt retained recovery point
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_STAGING_BACKUP_KEY: ${{ secrets.SERAMET_STAGING_BACKUP_KEY }}
        run: |
          node scripts/staging-recovery-envelope.mjs open "$RUNNER_TEMP/downloaded-recovery" "$RUNNER_TEMP/recovered-backup"
          cmp "$RUNNER_TEMP/seramet-staging-public.dump" "$RUNNER_TEMP/recovered-backup/seramet-staging-public.dump"
          cmp "$RUNNER_TEMP/seramet-staging-source-evidence.json" "$RUNNER_TEMP/recovered-backup/seramet-staging-source-evidence.json"
      - name: Restore backup into isolated PostgreSQL 17
        if: inputs.operation == 'verify-backup-restore'
        shell: bash
        env:
          PGPASSWORD: restore-only
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql \
            --host 127.0.0.1 --port 54329 --username postgres --dbname seramet_restore \
            --set ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA public CASCADE;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END;
          $$;
          SQL
          /usr/lib/postgresql/17/bin/pg_restore \
            --host 127.0.0.1 \
            --port 54329 \
            --username postgres \
            --dbname seramet_restore \
            --no-owner \
            --no-privileges \
            --exit-on-error \
            "$RUNNER_TEMP/recovered-backup/seramet-staging-public.dump"
      - name: Verify isolated restore completeness and integrity
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_RESTORE_POSTGRES_URL: postgresql://postgres:restore-only@127.0.0.1:54329/seramet_restore
          SERAMET_SOURCE_EVIDENCE_PATH: ${{ runner.temp }}/recovered-backup/seramet-staging-source-evidence.json
        run: node scripts/verify-staging-backup-restore.mjs
      - name: Apply official migrations to isolated restore
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_POSTGRES_URL: postgresql://postgres:restore-only@127.0.0.1:54329/seramet_restore
        run: npm run migrate:postgres
      - name: Apply and verify Data API lockdown on migrated isolated restore
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_POSTGRES_URL: postgresql://postgres:restore-only@127.0.0.1:54329/seramet_restore
          SERAMET_ISOLATED_RESTORE: "true"
        run: node scripts/verify-staging-data-api-lockdown-postgres.mjs
      - name: Verify audited no-replay hold transactions on disposable jobs
        if: inputs.operation == 'verify-backup-restore'
        env:
          SERAMET_POSTGRES_URL: postgresql://postgres:restore-only@127.0.0.1:54329/seramet_restore
        run: node scripts/verify-staging-worker-hold-postgres.mjs
      - name: Remove temporary database backup
        if: always() && inputs.operation == 'verify-backup-restore'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/seramet-staging-public.dump" "$RUNNER_TEMP/seramet-staging-source-evidence.json"
          rm -rf "$RUNNER_TEMP/encrypted-recovery" "$RUNNER_TEMP/downloaded-recovery" "$RUNNER_TEMP/recovered-backup"
      - name: Check write prerequisites independently
        if: inputs.operation == 'quarantine-imports' || inputs.operation == 'consolidate-management'
        env:
          TARGET: ${{ inputs.operation }}
          APPROVED_SHA: ${{ inputs.approved_plan_sha256 }}
          STAGING_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          BACKUP_EVIDENCE: ${{ secrets.SERAMET_STAGING_RESTORE_EVIDENCE }}
          STAGING_OPERATOR_APPROVAL: ${{ vars.SERAMET_STAGING_RECOVERY_OPERATOR_APPROVED }}
          NO_REPLAY: ${{ inputs.acknowledge_unscanned_no_replay }}
          QUEUE_REVIEW: ${{ inputs.acknowledge_queue_redelivery_reviewed }}
        run: |
          node <<'NODE'
          const e = process.env;
          if (e.STAGING_BACKUP_RESTORE_VERIFIED !== 'true' ||
              !e.BACKUP_EVIDENCE?.trim() ||
              e.STAGING_OPERATOR_APPROVAL !== 'true' ||
              !/^[a-f0-9]{64}$/.test(e.APPROVED_SHA || '')) {
            throw new Error('Refusing data mutation without independent backup+isolated restore, protected operator approval and the exact current plan SHA');
          }
          if (e.TARGET === 'quarantine-imports' && e.NO_REPLAY !== 'true') {
            throw new Error('Unscanned historical menu imports cannot be replayed');
          }
          if (e.TARGET === 'consolidate-management' && e.QUEUE_REVIEW !== 'true') {
            throw new Error('Cloudflare Queue redelivery inventory has not been reviewed');
          }
          NODE
      - name: Run guarded read-only import plan
        if: inputs.operation == 'inspect-imports'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
        run: node scripts/reconcile-staging-menu-imports.mjs --plan
      - name: Execute separately approved import quarantine
        if: inputs.operation == 'quarantine-imports'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_RECONCILE_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          SERAMET_RECONCILE_RESTORE_EVIDENCE: ${{ secrets.SERAMET_STAGING_RESTORE_EVIDENCE }}
          SERAMET_RECONCILE_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          SERAMET_RECONCILE_APPROVED_TENANT_REF: ${{ inputs.approved_tenant_ref }}
          SERAMET_RECONCILE_APPROVED_CANONICAL_REF: ${{ inputs.approved_canonical_ref }}
          SERAMET_RECONCILE_UNSCANNED_IMPORTS_WILL_NOT_REPLAY: ${{ inputs.acknowledge_unscanned_no_replay }}
          SERAMET_RECONCILE_OPERATOR: ${{ github.actor }}
        run: node scripts/reconcile-staging-menu-imports.mjs --apply
      - name: Run guarded read-only management plan
        if: inputs.operation == 'inspect-management'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
        run: node scripts/reconcile-staging-management-backlog.mjs --plan
      - name: Execute separately approved management backlog consolidation
        if: inputs.operation == 'consolidate-management'
        env:
          SERAMET_ENVIRONMENT: staging
          SERAMET_POSTGRES_URL: ${{ secrets.SERAMET_POSTGRES_URL }}
          SERAMET_MANAGEMENT_BACKUP_RESTORE_VERIFIED: ${{ vars.SERAMET_STAGING_BACKUP_RESTORE_VERIFIED }}
          SERAMET_MANAGEMENT_RESTORE_EVIDENCE: ${{ secrets.SERAMET_STAGING_RESTORE_EVIDENCE }}
          SERAMET_MANAGEMENT_OPERATOR: ${{ github.actor }}
          SERAMET_MANAGEMENT_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
          SERAMET_MANAGEMENT_APPROVED_BRANCH_REF: ${{ inputs.approved_branch_ref }}
          SERAMET_MANAGEMENT_APPROVED_RETAINED_JOB_REF: ${{ inputs.approved_retained_job_ref }}
          SERAMET_MANAGEMENT_QUEUE_REDELIVERY_REVIEWED: ${{ inputs.acknowledge_queue_redelivery_reviewed }}
        run: node scripts/reconcile-staging-management-backlog.mjs --apply
