name: Verify Printing Transport
on:
  pull_request:
    paths:
      - "local-print-bridge/**"
      - "printing-core/**"
      - "scripts/raster-wire-parser.mjs"
      - ".github/workflows/verify-printing.yml"
permissions:
  contents: read
jobs:
  printing:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: node --test local-print-bridge/printing.test.mjs local-print-bridge/raster.test.mjs
      - run: npx vitest run src/server/printing-api.test.ts src/lib/thermal-print-layout.test.ts src/printing/printer-routing.test.ts --maxWorkers=2
