name: Temporary table management formatter
on:
  push:
    branches: [feature/staging-westlands-dining-table-management-20260928]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format branch-owned source
        run: |
          npx prettier --write src/server/table-management-api.ts src/server/table-area-management-api.test.ts src/routes/tables.tsx src/components/app/DiningAreaDialog.tsx src/components/app/EditTableDialog.tsx
          for f in src/server/table-management-api.ts src/server/table-area-management-api.test.ts src/routes/tables.tsx src/components/app/DiningAreaDialog.tsx src/components/app/EditTableDialog.tsx; do
            echo "SERAMET_TABLE_FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "SERAMET_TABLE_FORMAT_END:$f"
          done
