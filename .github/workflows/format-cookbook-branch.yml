name: Format cookbook branch

on:
  push:
    branches: [feat/cookbook-shared-layer]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cookbook-shared-layer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree
        run: npm run build
      - name: Format cookbook implementation
        run: |
          npx prettier --write             src/cookbook/cookbook-service.ts             src/cookbook/cookbook-service.test.ts             src/cookbook/schemas.ts             src/cookbook/use-cookbook.ts             src/server/cookbook-api.ts             src/lib/seramet-api.ts             src/routes/cookbook.tsx             src/components/app/nav.ts             src/platform/module-access-registry.ts             src/routeTree.gen.ts             src/server/database/schema-version.ts             src/server/database/sqlite-test-adapter.ts             src/inventory/pass-6-inventory-intelligence.test.ts             src/intelligence/pass-9-intelligence.test.ts             src/server/pass-5-production-foundation.test.ts             src/management/pass-7-management-intelligence.test.ts             src/onboarding/pass-8-commercial-productization.test.ts
      - name: Commit generated and formatted files
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/format-cookbook-branch.yml
          git commit -m "Generate and format shared cookbook layer"
          git push origin HEAD:feat/cookbook-shared-layer
