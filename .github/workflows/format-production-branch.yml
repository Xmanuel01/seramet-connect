name: Format production branch

on:
  push:
    branches: [feat/production-control-centre]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-control-centre
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format production files
        run: |
          npx prettier --write             src/inventory/inventory-intelligence-service.ts             src/inventory/types.ts             src/inventory/schemas.ts             src/inventory/use-production-control-centre.ts             src/server/inventory-api.ts             src/routes/production.tsx             src/inventory/pass-6-inventory-intelligence.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/inventory/inventory-intelligence-service.ts             src/inventory/types.ts             src/inventory/schemas.ts             src/inventory/use-production-control-centre.ts             src/server/inventory-api.ts             src/routes/production.tsx             src/inventory/pass-6-inventory-intelligence.test.ts
          git commit -m "Format production control centre"
          git push origin HEAD:feat/production-control-centre
