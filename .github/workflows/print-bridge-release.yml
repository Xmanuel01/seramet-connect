name: Publish Windows Print Bridge
# Builds SerametPrintBridge.exe on Windows with Node 24, re-runs the installer
# smoke test, and publishes it as the release the Printers page links to.
# A merge to main that changes BRIDGE_VERSION publishes that version on its own,
# so the Printers page download and Update button never point at a missing file.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["local-print-bridge/server.mjs"]
concurrency: print-bridge-release
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip a version that is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*BRIDGE_VERSION = "\(.*\)";.*/\1/p' local-print-bridge/server.mjs)
          test -n "$version"
          if gh release view "print-bridge-v$version" >/dev/null 2>&1; then
            echo "print-bridge-v$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: node --test local-print-bridge/printing.test.mjs local-print-bridge/raster.test.mjs local-print-bridge/service.test.mjs
      - run: npm run bridge:build
      - run: node scripts/smoke-print-bridge-exe.mjs
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -e "import('./local-print-bridge/server.mjs').then(m=>console.log(m.BRIDGE_VERSION))")
          node -e "const u=require('fs').readFileSync('src/lib/print-bridge-client-config.ts','utf8');if(!u.includes('print-bridge-v'+process.argv[1]+'/'))throw new Error('Download URL does not match bridge '+process.argv[1])" "$version"
          cd .seramet/print-bridge
          sha256sum SerametPrintBridge.exe > SerametPrintBridge.exe.sha256
          gh release create "print-bridge-v$version" SerametPrintBridge.exe SerametPrintBridge.exe.sha256 \
            --target "$GITHUB_SHA" \
            --title "Seramet Print Bridge $version for Windows" \
            --notes "Download SerametPrintBridge.exe on the till PC and open it. Then in Seramet open Printers & devices and choose Connect this PC."
