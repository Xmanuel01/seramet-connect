name: Verify menu import PostgreSQL

on:
  pull_request:
    paths:
      - "src/onboarding/**"
      - "src/server/onboarding-api.ts"
      - "src/routes/menu-import.tsx"
      - "src/components/app/ManualMenuItemDialog.tsx"
      - "scripts/verify-menu-postgres.ts"
      - ".github/workflows/menu-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seramet_test
          POSTGRES_USER: seramet_test
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seramet_test -d seramet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERAMET_POSTGRES_URL: postgresql://seramet_test:isolated_ci_only@127.0.0.1:5432/seramet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply all existing migrations to isolated PostgreSQL
        run: npm run migrate:postgres
      - name: Verify real menu catalogue query and branch isolation
        run: ./node_modules/.bin/vite-node scripts/verify-menu-postgres.ts
