name: POS Page 1 Validation

on:
  push:
    branches:
      - "fix/pos-page-1-hardening"
    paths:
      - "src/routes/pos.tsx"
      - "src/lib/transaction-engine.ts"
      - "src/lib/seramet-flows.test.ts"
      - "src/lib/menu-product.ts"
      - "src/hooks/use-operational-menu.ts"
      - "src/lib/seramet-api.ts"
      - ".github/workflows/pos-page1-validation.yml"
  pull_request:
    paths:
      - "src/routes/pos.tsx"
      - "src/lib/transaction-engine.ts"
      - "src/lib/seramet-flows.test.ts"
      - "src/lib/menu-product.ts"
      - "src/hooks/use-operational-menu.ts"
      - "src/lib/seramet-api.ts"
      - ".github/workflows/pos-page1-validation.yml"

permissions:
  contents: read

jobs:
  validate-pos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: POS transaction flow tests
        run: npx vitest run src/lib/seramet-flows.test.ts
      - name: Full test suite
        run: npm test
      - run: npm run build
      - name: Verify production bundle has no source secrets
        run: npm run audit:bundle
