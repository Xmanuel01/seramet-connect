name: Format documented integration

on:
  push:
    branches:
      - integration/documented-implementations-20260923

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/documented-implementations-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format documented implementation files
        run: |
          npx prettier --write \
            src/components/app/ui.tsx \
            src/hooks/use-operational-menu.ts \
            src/lib/pos-kitchen-amendment.test.ts \
            src/lib/transaction-engine.ts \
            src/onboarding/onboarding-service.ts \
            src/routes/cost-centres.tsx \
            src/routes/pos.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/ui.tsx src/hooks/use-operational-menu.ts src/lib/pos-kitchen-amendment.test.ts src/lib/transaction-engine.ts src/onboarding/onboarding-service.ts src/routes/cost-centres.tsx src/routes/pos.tsx
          git commit -m "Format documented integration files"
          git push origin HEAD:integration/documented-implementations-20260923
